name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the web app (Vite only; the prerender needs the live API)
        run: pnpm --filter @workspace/transyachtgroup exec vite build --config vite.config.ts

      # The next two are informational for now: they report the baseline without blocking a merge.
      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Dependency audit (production)
        run: pnpm audit --prod
        continue-on-error: true
